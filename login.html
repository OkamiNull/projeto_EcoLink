<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css"> <!-- Use o seu arquivo CSS -->
    <title>EcoLink - Login</title>
</head>
<body class="login-page">

    <header>
        <div class="logo">
            <h2>♻️ EcoLink</h2>
        </div>
        <nav>
            <a href=".html">Voltar ao Início</a>
        </nav>
    </header>

    <main class="login-container">
        <section class="login-card">
            <h1>Bem-vindo de volta!</h1>
            <p>Acesse sua conta para gerenciar seus eventos.</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
                
                <div class="login-footer">
                    <a href="#">Esqueceu a senha?</a>
                    <span>Ainda não tem conta? <a href="#">Cadastre-se</a></span>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 EcoAção - Juntos por um futuro sustentável.</p>
    </footer>

</body>
</html>
