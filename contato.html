<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecolink - Contato</title>
    <link rel="stylesheet" href="contato.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">♻️ EcoLink</div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
    <div class="contact-wrapper">
        
        <div class="contact-info">
            <div class="icon-box-mail">
                <svg viewBox="0 0 24 24" fill="#475569" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zm0 2v2l8 5 8-5V6l-8 5-8-5z"/>
                </svg>
            </div>
        </div>

        <div class="contact-card">
            <h1>Contate-nos</h1>
            
            <form class="contact-form">
                <div class="form-row">
                    <div class="input-group">
                        <label>Nome completo</label>
                        <input type="text">
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email">
                    </div>
                </div>

                <div class="message-row">
                    <div class="input-group">
                        <label>Mensagem</label>
                        <textarea rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn-send">Enviar</button>
                </div>
            </form>
        </div>

    </div>
</main>

    <footer class="footer">
        <div class="footer-top">
            <span class="logo-footer">Ecolink</span>
            <div class="footer-links">
                <a href="#">Sobre Nós</a>
                <a href="#">Contato</a>
            </div>
            <div class="social-icons">
                <span>📸</span> <span>🔵</span> <span>🐦</span>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Ecolink. Todos os direitos reservados. | Política de Privacidade | Termos de Serviço</p>
        </div>
    </footer>

</body>
</html>
